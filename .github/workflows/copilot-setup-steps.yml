name: "Copilot Setup Steps"

on:
  workflow_dispatch:

jobs:
  # The job MUST be named copilot-setup-steps
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install mcptools and project dependencies
        run: |
          Rscript -e 'install.packages(c("mcptools", "btw"))'
          # Optional: if your repo uses renv, restore project packages
          # Rscript -e 'if (file.exists("renv.lock")) renv::restore()'
